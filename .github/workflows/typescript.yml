name: TypeScript

on:
  push:
    branches: [main]
    paths: ["typescript/**", ".github/workflows/typescript.yml"]
  pull_request:
    branches: [main]
    paths: ["typescript/**", ".github/workflows/typescript.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and conformance tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Live resolver smoke test
        # GitHub runners have a validating resolver; failures here are network, not code.
        continue-on-error: true
        run: npm run test:live
