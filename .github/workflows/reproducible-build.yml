name: Reproducible Build

# Verifies that the wheel and sdist build reproducibly: two independent
# builds with SOURCE_DATE_EPOCH pinned to the last commit's timestamp must
# produce byte-identical artifacts. Evidence for the OpenSSF Best Practices
# Gold criterion `build_reproducible`
# (docs/proposals/openssf-best-practices.md, item G4).

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/reproducible-build.yml"
  schedule:
    # Weekly, Mondays 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Build twice and compare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tool (hash-pinned)
        run: pip install --require-hashes -r .github/workflows/requirements-release.txt

      - name: Build twice with pinned SOURCE_DATE_EPOCH
        # Build OUT of tree: hatchling pulls every non-gitignored file into the
        # sdist, so an in-repo dist-a/ would get swallowed into dist-b's archive
        # and the digests would differ for reasons unrelated to reproducibility.
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m build --outdir "$RUNNER_TEMP/dist-a"
          python -m build --outdir "$RUNNER_TEMP/dist-b"

      - name: Compare artifacts
        run: |
          (cd "$RUNNER_TEMP/dist-a" && sha256sum ./*) | tee sums-a.txt
          (cd "$RUNNER_TEMP/dist-b" && sha256sum ./*) | tee sums-b.txt
          if ! diff sums-a.txt sums-b.txt; then
            echo "::error::Build is not reproducible: artifact digests differ between identical builds."
            exit 1
          fi
          echo "OK: wheel and sdist are byte-identical across independent builds."
