name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        uses: KineticCafe/actions-dco@e9627100b7f566546e67cde54bfa7d3790ab649b  # v4.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
