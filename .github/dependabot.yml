version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      patch-security:
        update-types:
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "automated"
    groups:
      # github/codeql-action's sub-actions (init/autobuild/analyze/upload-sarif)
      # are one repo pinned by one SHA and REQUIRE lockstep versions: init writes
      # a config stamped with its version and analyze refuses any other. Without
      # grouping, Dependabot bumps each subpath as a separate dependency and the
      # partial bump fails CodeQL deterministically (see #207).
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The Dockerfile pins its base image by digest for reproducibility, but the
  # python:3.11-slim tag is rebuilt regularly and old index digests eventually
  # stop resolving — at which point `docker build` fails at the first
  # instruction with "not found". That is not hypothetical: the previously
  # pinned digest had already gone dead, so the image could not be built at all
  # until it was repinned. A digest pin only stays valid if something refreshes
  # it, so let Dependabot own that.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "automated"
